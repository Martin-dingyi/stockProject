# 配置股票相关的参数
stock:
  inner_market_id: # A股
    - sh000001 # 上证ID
    - sz399001 #  深证ID
  outer_market_id: # 外盘
    - int_dji # 道琼斯
    - int_nasdaq # 纳斯达克
    - int_hangseng # 恒生
    - int_nikkei # 日经指数
    - b_FSSTI # 新加坡

  inner_market_url: http://hq.sinajs.cn/list= # 后面填股市代码，用逗号分割，如http://hq.sinajs.cn/list=sh000001,sz399001
  outer_market_url: http://hq.sinajs.cn/list=
  a_stock_url: http://hq.sinajs.cn/list=
  inner_block_url: https://vip.stock.finance.sina.com.cn/q/view/newSinaHy.php


# 定时任务线程池基础参数
task:
  pool:
    corePoolSize: 80 # 核心线程数
    maxPoolSize: 140 # 设置最大线程数
    keepAliveSeconds: 300 # 设置线程活跃时间，单位秒
    queueCapacity: 100 # 设置队列容量
